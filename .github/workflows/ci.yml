name: Release candidate validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ari-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  dotnet:
    name: .NET build and deterministic tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore AutomotiveRepairIntelligence.slnx --locked-mode
      - name: Build release candidate
        run: dotnet build AutomotiveRepairIntelligence.slnx --configuration Release --no-restore
      - name: Core tests
        run: dotnet test tests/ARI.Core.Tests/ARI.Core.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=core.trx" --results-directory TestResults
      - name: API tests
        run: dotnet test tests/ARI.Api.Tests/ARI.Api.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=api.trx" --results-directory TestResults
      - name: Web tests
        run: dotnet test tests/ARI.Web.Tests/ARI.Web.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=web.trx" --results-directory TestResults
      - name: Upload .NET results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults/*.trx
          if-no-files-found: error

  python:
    name: Python contracts and ML tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: ml/requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --requirement ml/requirements.lock
          python -m pip install --no-build-isolation --no-deps --editable ml
      - name: Run Python regression suite
        run: python -m pytest ml/tests -k "not TrainedArtifactAcceptanceTests" --junitxml=TestResults/python.xml
      - name: Upload Python results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: TestResults/python.xml
          if-no-files-found: error

  browser:
    name: Deterministic browser acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore AutomotiveRepairIntelligence.slnx --locked-mode
      - name: Build browser suite
        run: dotnet build AutomotiveRepairIntelligence.slnx --configuration Release --no-restore
      - name: Install Playwright Chromium
        shell: pwsh
        run: ./tests/ARI.Web.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run fixture-backed browser tests
        run: dotnet test tests/ARI.Web.E2ETests/ARI.Web.E2ETests.csproj --configuration Release --no-build --no-restore --filter "Category!=Live&Category!=LiveCapture" --logger "trx;LogFileName=browser.trx" --results-directory TestResults
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: TestResults/browser.trx
          if-no-files-found: error

  security:
    name: Publication hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and full history
        shell: pwsh
        run: ./tools/security-audit.ps1
